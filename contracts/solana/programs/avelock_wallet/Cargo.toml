[package]
name = "avelock_wallet"
version = "1.0.0"
description = "Avelock Wallet — self-custody vault with on-chain withdrawal delays (Solana/Anchor port)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "avelock_wallet"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
